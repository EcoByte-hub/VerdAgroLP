<!doctype html>
<!--
  Template da imagem Open Graph do VerdAgro (1200x630).
  Renderize este arquivo num navegador com viewport 1200x630 e salve o
  screenshot em public/og-image.png (e public/twitter-image.png, mesmo arquivo).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,50;1,9..144,300..800,50&family=JetBrains+Mono:wght@500&family=Manrope:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0e2a1f;
        color: #f3eee2;
        font-family: 'Manrope', sans-serif;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(243,238,226,.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(243,238,226,.045) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .glow {
        position: absolute; width: 620px; height: 620px; border-radius: 50%;
        right: -160px; top: -200px; background: rgba(197,242,92,.16); filter: blur(110px);
      }
      .content { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 640px; display: flex; flex-direction: column; }
      .logo { display: flex; align-items: center; gap: 14px; }
      .wordmark { font-family: 'Fraunces', serif; font-size: 34px; letter-spacing: -0.03em; }
      .wordmark b { font-weight: 600; }
      .wordmark i { font-weight: 400; }
      h1 {
        margin-top: 54px;
        font-family: 'Fraunces', serif; font-weight: 400; font-size: 84px; line-height: .98; letter-spacing: -0.025em;
        font-variation-settings: 'SOFT' 50, 'opsz' 144;
      }
      h1 em { font-weight: 300; color: #c5f25c; }
      p.sub { margin-top: 26px; font-size: 22px; line-height: 1.45; color: rgba(243,238,226,.72); max-width: 560px; }
      .foot { margin-top: auto; display: flex; gap: 10px; align-items: center; }
      .pill {
        font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
        padding: 9px 14px; border-radius: 999px; border: 1px solid #1f4a35; color: rgba(243,238,226,.8);
      }
      .pill.solid { background: #c5f25c; border-color: #c5f25c; color: #0e2a1f; }
      .map { position: absolute; right: 56px; top: 95px; width: 440px; height: 440px; }
      .coords { position: absolute; right: 64px; bottom: 34px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #4f8a5b; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <svg class="map" viewBox="0 0 560 560" id="map"></svg>

    <div class="content">
      <div class="logo">
        <svg viewBox="0 0 64 64" width="52" height="52">
          <rect width="64" height="64" rx="16" fill="#c5f25c" />
          <path d="M14 50C14 30 28 14 50 14c0 22-16 36-36 36Z" fill="#0e2a1f" />
          <path d="M14 50 40 24M22 50l18-18M14 42l18-18" stroke="#c5f25c" stroke-width="3.2" stroke-linecap="round" />
        </svg>
        <span class="wordmark"><b>Verd</b><i>Agro</i></span>
      </div>

      <h1>Do campo ao<br /><em>crédito de carbono.</em></h1>
      <p class="sub">Inteligência ambiental e marketplace que conecta produtores rurais a empresas compradoras.</p>

      <div class="foot">
        <span class="pill solid">HackBrasil</span>
        <span class="pill">Economia Verde</span>
        <span class="pill">Equipe EcoByte</span>
      </div>
    </div>

    <div class="coords">LAT -17.7923 · LON -50.9192 · NDVI</div>

    <script>
      // Mesmo desenho do mapa do hero (HeroMap.tsx)
      const PROPERTY = 'M118 170 L248 120 L380 150 L438 252 L404 372 L292 420 L168 392 L104 290 Z';
      const COLORS = ['#1f4a35', '#2e5e43', '#4f8a5b', '#7fb35f', '#c5f25c'];
      const ndvi = i => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
      let cells = '';
      for (let y = 100; y < 440; y += 28) for (let x = 90; x < 460; x += 28) {
        const v = ndvi(x * 7 + y * 13);
        const d = Math.hypot(x - 280, y - 270) / 220;
        const s = Math.min(0.999, Math.max(0, v * 0.55 + (1 - d) * 0.6));
        cells += `<rect x="${x}" y="${y}" width="26" height="26" rx="3" fill="${COLORS[Math.floor(s * 5)]}" opacity="${(0.55 + v * 0.4).toFixed(2)}"/>`;
      }
      const verts = PROPERTY.match(/\d+ \d+/g).map(p => {
        const [x, y] = p.split(' ');
        return `<circle cx="${x}" cy="${y}" r="5" fill="#0e2a1f" stroke="#c5f25c" stroke-width="2.5"/>`;
      }).join('');
      document.getElementById('map').innerHTML = `
        <defs><clipPath id="c"><path d="${PROPERTY}"/></clipPath></defs>
        <path d="M-20 80 C 90 40, 200 110, 300 70 S 480 20, 580 70" fill="none" stroke="#1f4a35" stroke-width="1.4"/>
        <path d="M-20 500 C 120 460, 210 530, 330 490 S 480 450, 580 500" fill="none" stroke="#1f4a35" stroke-width="1.4"/>
        <g clip-path="url(#c)">${cells}</g>
        <path d="${PROPERTY}" fill="none" stroke="#c5f25c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M300 200 L392 222 L404 312 L330 340 L282 290 Z" fill="#e39a75" fill-opacity=".1" stroke="#e39a75" stroke-width="2" stroke-dasharray="7 7"/>
        ${verts}
        <circle cx="275" cy="265" r="16" fill="#c5f25c" opacity=".25"/>
        <circle cx="275" cy="265" r="7" fill="#c5f25c" stroke="#0e2a1f" stroke-width="4"/>`;
    </script>
  </body>
</html>
